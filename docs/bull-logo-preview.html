body { margin:0; background:#f1ebdf; color:#26231f; font:16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; overflow-x:hidden; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 32px 24px 60px; }
.card { background:#fff; border-radius: 22px; padding: 30px; box-shadow: 0 1px 2px rgba(38,35,31,.05), 0 18px 40px -24px rgba(38,35,31,.22); display:grid; place-items:center; }

.bullmark { position: relative; display: inline-block; padding: 12% 20% 0 0; flex: none; }
.bullmark .art { position: relative; }

.bullmark .face { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ece5d8); box-shadow: 0 0 0 1.5px #26231f, 0 4px 8px rgba(38,35,31,.28); display: grid; place-items: center; }
.bullmark .face svg { width: 60%; height: 60%; }
.bullmark .streaks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 2; pointer-events: none; }
.bullmark .burst { position: absolute; width: 12%; left: 92%; top: 12%; transform: translate(-50%,-50%) rotate(12deg); z-index: 1; opacity: .95; }
.brand .bullmark { width: 150px; margin: -6px 0 -4px -6px; }
